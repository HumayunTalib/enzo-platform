name: Publish scheduled journal posts

on:
  schedule:
    - cron: '30 3 * * *'      # every day at 03:30 UTC (08:30 in Pakistan)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish articles that are due
        run: node tools/publish-queue.js

      - name: Sync header and footer into new pages
        run: node build.js

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name  "enzo-journal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish scheduled journal posts ($(date -u +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed (check Settings > Pages)"
