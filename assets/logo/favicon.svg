<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- ENZO favicon — Markhor horns (Pakistan's national animal; the paired
       spiral-horn silhouette is the standard iconographic shorthand used in
       Pakistani military and scouting insignia) over the ENZO navy ground. -->
  <rect width="32" height="32" fill="#142B44"/>
  <path id="markhor-horn" d="M17,23 C20,21 15,18 19,16 C23,14 16,11 20,9 C24,7 18,5 21,3"
        fill="none" stroke="#F7F5F1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#markhor-horn" transform="scale(-1,1) translate(-32,0)"/>
  <path d="M12.5,24.5 Q16,20.5 19.5,24.5 L17.5,29.5 Q16,31 14.5,29.5 Z" fill="#F7F5F1"/>
</svg>
