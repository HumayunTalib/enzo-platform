<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d"><title id="t">Moisture regain of common textile fibres</title><desc id="d">Horizontal bar chart: polyester 0.4 percent, cotton 7.0 to 8.5 percent, linen about 12 percent, viscose or rayon 11 to 13 percent.</desc><rect width="720" height="340" fill="#FFFFFF"/><text x="24" y="34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0A0A0A">Moisture regain at standard conditions (% of dry weight)</text><line x1="190.0" y1="56" x2="190.0" y2="270" stroke="#E6EAF9"/><text x="190.0" y="292" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4A5578" text-anchor="middle">0</text><line x1="255.7" y1="56" x2="255.7" y2="270" stroke="#E6EAF9"/><text x="255.7" y="292" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4A5578" text-anchor="middle">2</text><line x1="321.4" y1="56" x2="321.4" y2="270" stroke="#E6EAF9"/><text x="321.4" y="292" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4A5578" text-anchor="middle">4</text><line x1="387.1" y1="56" x2="387.1" y2="270" stroke="#E6EAF9"/><text x="387.1" y="292" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4A5578" text-anchor="middle">6</text><line x1="452.9" y1="56" x2="452.9" y2="270" stroke="#E6EAF9"/><text x="452.9" y="292" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4A5578" text-anchor="middle">8</text><line x1="518.6" y1="56" x2="518.6" y2="270" stroke="#E6EAF9"/><text x="518.6" y="292" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4A5578" text-anchor="middle">10</text><line x1="584.3" y1="56" x2="584.3" y2="270" stroke="#E6EAF9"/><text x="584.3" y="292" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4A5578" text-anchor="middle">12</text><line x1="650.0" y1="56" x2="650.0" y2="270" stroke="#E6EAF9"/><text x="650.0" y="292" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4A5578" text-anchor="middle">14</text><text x="176" y="92" font-family="Inter,Arial,sans-serif" font-size="15" fill="#0A0A0A" text-anchor="end">Polyester</text><rect x="190" y="70" width="13.1" height="32" rx="3" fill="#1E3585"/><text x="213.1" y="92" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">0.4%</text><text x="176" y="142" font-family="Inter,Arial,sans-serif" font-size="15" fill="#0A0A0A" text-anchor="end">Cotton</text><rect x="190" y="120" width="279.3" height="32" rx="3" fill="#9FB0EE"/><rect x="190" y="120" width="230.0" height="32" rx="3" fill="#1E3585"/><text x="479.3" y="142" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">7.0–8.5%</text><text x="176" y="192" font-family="Inter,Arial,sans-serif" font-size="15" fill="#0A0A0A" text-anchor="end">Linen (flax)</text><rect x="190" y="170" width="394.3" height="32" rx="3" fill="#1E3585"/><text x="594.3" y="192" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">≈12%</text><text x="176" y="242" font-family="Inter,Arial,sans-serif" font-size="15" fill="#0A0A0A" text-anchor="end">Viscose / rayon</text><rect x="190" y="220" width="427.1" height="32" rx="3" fill="#9FB0EE"/><rect x="190" y="220" width="361.4" height="32" rx="3" fill="#1E3585"/><text x="627.1" y="242" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">11–13%</text><text x="24" y="312" font-family="Inter,Arial,sans-serif" font-size="11" fill="#4A5578">Source values: ASTM D1909 (polyester, cotton, flax, rayon); viscose upper range from published fibre data.</text><text x="24" y="326" font-family="Inter,Arial,sans-serif" font-size="11" fill="#4A5578">Dark bar = lower value, light bar = reported range.</text></svg>